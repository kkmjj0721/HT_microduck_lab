[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ht-microduck"
version = "0.1.0"
description = "Custom reinforcement learning and mixed-actuator simulation with mjlab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.6.0",
    "mujoco~=3.11.0",
    "mujoco-warp~=3.11.0",
    "numpy>=1.26.0",
    "tensorboard>=2.20.0",
    "torch>=2.7.0,<3.0.0",
    "tqdm>=4.67.0",
    "tyro>=1.0.1",
    "warp-lang>=1.14.0",
]
# mjlab brings rsl-rl-lib==5.4.2 as a transitive dependency. This repository keeps
# a verbatim copy at rsl_rl/ and that copy -- not the wheel -- is what training,
# replay and export import; see src/ht_microduck/__init__.py for the ordering.
# GitPython is not declared here on purpose: rsl_rl/utils/logger.py imports it, but
# rsl-rl-lib==5.4.2 already requires it, and declaring it again would force a full
# re-resolve of uv.lock for one already-guaranteed edge.

[project.optional-dependencies]
cpu = ["torch>=2.7.0,<3.0.0", "warp-lang>=1.14.0"]
cu118 = ["torch>=2.7.0,<3.0.0", "warp-lang>=1.14.0"]
cu126 = ["torch>=2.7.0,<3.0.0", "warp-lang>=1.14.0"]
cu128 = ["torch>=2.7.0,<3.0.0", "warp-lang>=1.14.0"]
cu129 = ["torch>=2.7.0,<3.0.0", "warp-lang>=1.14.0"]
cu130 = ["torch>=2.7.0,<3.0.0", "warp-lang>=1.14.0"]
export = [
    "onnx>=1.18.0",
    "onnxruntime>=1.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

# Imported by `import mjlab` at startup (mjlab/__init__.py::_import_registered_packages),
# which is what makes our tasks appear in `list_tasks()` without an explicit import.
[project.entry-points."mjlab.tasks"]
ht_microduck = "ht_microduck.tasks"

# Both names delegate to mjlab's own train/play entry points: the CLI, log layout
# and viewer are upstream's, only the resolved `rsl_rl` differs (see train_cli.py).
# They are NOT named `train`/`play`: mjlab installs those, same-name console
# scripts are last-writer-wins, and the loser leaves a stale shim behind.
[project.scripts]
duck-train = "ht_microduck.train_cli:main"
duck-play = "ht_microduck.play_cli:main"

[tool.uv]
# The initial training environment targets Linux x86_64 with an NVIDIA GPU.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Each environment uses one PyTorch backend; uv locks all choices together.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu118" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu129" },
        { extra = "cu130" },
    ],
]

[[tool.uv.index]]
name = "pypi"
# Use a PyPI mirror for general dependencies; torch and Warp use explicit indexes.
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu129", extra = "cu129" },
    { index = "pytorch-cu130", extra = "cu130" },
]
# Warp's default 1.18 wheel uses CUDA 13; CUDA 12 backends use NVIDIA's
# same-version compatibility build so R525-R579 drivers can run the simulator.
warp-lang = [
    { index = "nvidia", extra = "cpu" },
    { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", extra = "cu118" },
    { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", extra = "cu126" },
    { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", extra = "cu128" },
    { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", extra = "cu129" },
    { index = "nvidia", extra = "cu130" },
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
# rsl_rl/ is the project's copy of rsl-rl-lib 5.4.2 (BSD-3-Clause) and is the code
# training/replay/export actually import. It is a verbatim vendor drop: it keeps
# upstream style and must not be reformatted or patched in place.
# force-exclude makes the exclusion apply even when the path is passed explicitly.
extend-exclude = ["rsl_rl"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
